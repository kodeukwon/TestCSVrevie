name: Release APK 빌드 및 배포

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v1.0.1 등의 태그가 푸시될 때 실행
  workflow_dispatch:  # 수동 실행

jobs:
  build-and-release:
    name: APK 빌드 및 GitHub Release 생성
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: ☕ Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 📦 의존성 설치
        run: flutter pub get

      - name: 🔨 APK 빌드 (Release)
        run: flutter build apk --release

      - name: 📱 APK 파일명 설정
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd build/app/outputs/flutter-apk
          mv app-release.apk blogger-app-${VERSION}.apk
          echo "APK_FILE=blogger-app-${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 🚀 GitHub Release 생성
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/${{ env.APK_FILE }}
          body: |
            ## 📱 Blogger 포스팅 앱 ${{ env.VERSION }}

            ### 다운로드
            - **Android APK**: ${{ env.APK_FILE }}

            ### 설치 방법
            1. APK 파일 다운로드
            2. 스마트폰으로 전송
            3. "알 수 없는 출처" 허용
            4. APK 설치

            ### 주요 기능
            - ✅ Google Blogger 계정 로그인
            - ✅ 블로그 포스트 작성
            - ✅ 이미지 업로드 (갤러리/카메라)
            - ✅ HTML 에디터
            - ✅ 라벨(태그) 관리
            - ✅ 임시저장 및 게시

            ### 필요 사항
            - Android 5.0 (API 21) 이상
            - Google Blogger 계정

            ---
            자세한 사용법은 [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)를 참고하세요.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎉 배포 완료
        run: |
          echo "✅ Release ${{ env.VERSION }} 배포 완료!"
          echo "📱 다운로드: https://github.com/${{ github.repository }}/releases"
