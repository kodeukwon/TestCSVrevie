name: Android APK 자동 빌드

on:
  push:
    branches:
      - claude/cloud-account-differences-32ZVF
      - main
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-android:
    name: Android APK 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: ☕ Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: 🔧 Flutter Doctor
        run: flutter doctor -v

      - name: 📦 의존성 설치
        run: flutter pub get

      - name: 🔨 APK 빌드
        run: flutter build apk --release --verbose

      - name: 📱 APK 파일명 변경
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk blogger-app-${{ github.sha }}.apk

      - name: 📤 APK 업로드 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: blogger-app-apk
          path: build/app/outputs/flutter-apk/blogger-app-*.apk

      - name: 🎉 빌드 성공
        run: |
          echo "✅ APK 빌드 완료!"
          echo "📱 다운로드: Actions 탭 > 해당 워크플로우 > Artifacts"
