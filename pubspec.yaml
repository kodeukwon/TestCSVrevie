name: blogger_app
description: Google Blogger 포스팅 앱 - 모바일 및 데스크톱 지원
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & 아이콘
  cupertino_icons: ^1.0.6
  flutter_markdown: ^0.6.18

  # Google API
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  http: ^1.2.0

  # 이미지 처리
  image_picker: ^1.0.7
  image: ^4.1.7

  # 상태 관리
  provider: ^6.1.1

  # 로컬 저장소
  shared_preferences: ^2.2.2

  # 파일 처리
  path_provider: ^2.1.2
  file_picker: ^6.1.1

  # HTML 에디터
  html_editor_enhanced: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # assets:
  #   - images/
  #   - icons/
