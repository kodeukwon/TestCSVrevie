name: blogger_app
description: Google Blogger 포스팅 앱 - 모바일 및 데스크톱 지원
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & 아이콘
  cupertino_icons: ^1.0.2

  # Google API
  google_sign_in: ^6.1.0
  googleapis: ^11.0.0
  googleapis_auth: ^1.4.0
  http: ^0.13.5

  # 이미지 처리
  image_picker: ^1.0.0

  # 상태 관리
  provider: ^6.0.0

  # 로컬 저장소
  shared_preferences: ^2.0.0

  # 파일 처리
  path_provider: ^2.0.0
  file_picker: ^5.0.0

  # HTML 에디터 (간단한 대체)
  flutter_quill: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - images/
  #   - icons/
